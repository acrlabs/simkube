---
name: simkube end-to-end test
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      trace_type:
        required: true
        default: cronjob
        type: choice
        options:
          - bare-pods
          - cronjob
          - dsb-scaling
      debug:
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IN_CI: "true"
  TRACE_TYPE: ${{ inputs.trace || 'cronjob' }}

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: maintainer-approval
    steps:
      - name: Approved
        run: echo "Approved by ${GITHUB_ACTOR}"

  launch-runner:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Setup SimKube GitHub Action runner
        uses: acrlabs/simkube-ci-action/actions/launch-runner@19504e9b1d92287d09500505af3274b7be2cf74a
        with:
          # When you change this, make sure the AMI is on the excluded list in moria so it doesn't get cleaned up
          ami-id: ami-07f18d6d2097f593a  # TODO: make this dynamic / latest AMI
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          instance-type: m6a.large
          instance-profile: simkube-runner
          keep-alive: ${{ inputs.debug }}
          security-group-ids: sg-0fd593b495c5e0ffd
          simkube-runner-pat: ${{ secrets.SIMKUBE_RUNNER_PAT }}
          subnet-id: subnet-0cd4625c825e73e61

  simkube-e2e-test:
    needs: launch-runner
    runs-on: [self-hosted, simkube, ephemeral]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Builder
        uses: ./.github/actions/setup-builder

      - name: Add .local/bin to PATH
        run: echo "/home/ubuntu/.local/bin" >> $GITHUB_PATH

      - name: Set up logging connector
        run: ./scripts/e2e-install-victorialogs-connector.sh

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
        env:
          AWS_REGION: us-west-2

      - name: Fetch Docker images (or build them)
        run: make fetch-images || make build image
        env:
          UPSTREAM_DOCKER_REGISTRY: 174155008850.dkr.ecr.us-west-2.amazonaws.com

      - name: Run latest SimKube components
        run: make run

      - name: Wait for cluster rollout
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for simkube deployments..."
          for d in $(kubectl get deploy -n simkube -o name); do
            echo "Waiting for $d"
            kubectl rollout status $d -n simkube --timeout=120s
          done

          echo "All deployments rolled out"

      - name: Verify simkube images are from local registry
        shell: bash
        run: ./scripts/e2e-local-registry-check.sh

      - name: Get driver image
        id: get_driver_image  # don't delete this ID, it's used in the run sim step below
        shell: bash
        run: ./scripts/e2e-get-driver-image.sh

      - name: Start pod monitor
        shell: bash
        run: |
          setsid nohup ./scripts/e2e-monitor.sh > /tmp/e2e-monitor.log 2>&1 < /dev/null &
          echo $! >/tmp/e2e-monitor.pid

      - name: Run simulation
        uses: acrlabs/simkube-ci-action/actions/run-simulation@94f82b722827cc670d51b9aaa24d8bfacb802075
        with:
          simulation-name: test-cronjob-sim
          trace-path: examples/traces/${{ env.TRACE_TYPE }}.sktrace
          driver-image: ${{ steps.get_driver_image.outputs.driver_image }}

      - name: Collect sim data
        if: always()
        shell: bash
        run: |
          monitor_pid=$(cat /tmp/e2e-monitor.pid)
          kill -TERM -"$monitor_pid" 2>/dev/null || kill "$monitor_pid" 2>/dev/null || true
          cat /tmp/e2e-monitor.log
